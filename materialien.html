<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Print-Hub | Materialien</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-wrapper">
        <div class="dots-base"></div>
        <div class="dots-glow"></div>
    </div>
    <!-- Header (Unverändert, da perfekt) -->
    <header id="global-header"></header> 
<main>
    <section class="materials-page">
        <h1 class="materials-main-title" data-i18n="materials_headline">Materialien</h1>

        <!-- Container für dynamische Materialien -->
        <div class="materials-container" id="materials-grid">
            <!-- Loading State -->
             <p style="color:white; text-align:center; width:100%;" data-i18n="materials_loading">Lade Materialien...</p>
        </div>
    </section>
</main>
    <!-- Footer -->
    <footer>
        <div class="footer-inner">
            <span>© Copyright: Bahrian Novotny & Lorenzo Bay-Müller</span>
            <div class="footer-links">
                <a href="#">Impressum</a> | <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Chat Button Fixed -->
    <div class="chat-fab">
        <i class="fa-regular fa-comment"></i> <span data-i18n="chat_label_short">Chat</span>
    </div>

    <script src="./js/translations.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
