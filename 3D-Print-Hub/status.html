<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Print-Hub | Status</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <<div class="background-wrapper">
        <div class="dots-base"></div>
        <div class="dots-glow"></div>
    </div>

    <!-- Header (Unverändert, da perfekt) -->
    <header class="wix-header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo-box">
                    <img src="https://static.wixstatic.com/media/1a2196_fbe9ff330b1346d9818a251995ddf4fa~mv2.png/v1/fill/w_333,h_201,fp_0.50_0.50,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/3d-printer-3308167_1920.png" alt="DE" class="logo-image">
                </div>
                <div class="separator"></div>
                <span class="brand-name">STATUS</span>
            </div>
            <div class="header-center">
                <div class="player-pill">
                    <i class="fa-solid fa-play"></i>
                    <div class="progress-bar"></div>
                </div>
            </div>
            <div class="header-right">
                <div class="lang-pill">
                    <img src="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/flags/4x3/de.svg" alt="DE" class="flag">
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <nav class="nav-pill">
                    <a href="../index.html" class="nav-item">Home</a>
                    <a href="/buchen.html" class="nav-item">Buchen</a>
                    <a href="/status.html" class="nav-item active">Order Status</a>
                    <a href="/modelle.html" class="nav-item">Modell aussuchen</a>
                    <a href="/materials.html" class="nav-item">Materialien</a>
                    <a href="/galerie.html" class="nav-item">Gallerie</a>
                    <a href="#" class="nav-arrow">></a>
                </nav>
            </div>
        </div>
    </header>
<main class="status-page-content">
    <div class="status-hero">
        <div class="search-form-container">
            <label for="orderInput" class="input-label">Deine Bestellnummer *</label>
            <div class="input-wrapper">
                <input type="number" id="orderInput" placeholder="z.B 123456" class="status-input">
            </div>
            <button id="submitBtn" class="status-submit-btn">Submit</button>
        </div>

        <div id="resultsTableContainer" class="results-container hidden">
            <table class="status-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Status</th>
                        <th>Deteils&Name</th> <!-- Tippfehler aus Video übernommen -->
                        <th>Prozent</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Wird per JS befüllt -->
                </tbody>
            </table>
        </div>
    </div>
</main>
    <!-- Footer -->
    <footer>
        <div class="footer-inner">
            <span>© Copyright: Bahrian Novotny & Lorenzo Bay-Müller</span>
            <div class="footer-links">
                <a href="#">Impressum</a> | <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Chat Button Fixed -->
    <div class="chat-fab">
        <i class="fa-regular fa-comment"></i> Chat with us
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
