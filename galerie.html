<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Print-Hub | Gallerie</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-wrapper">
        <div class="dots-base"></div>
        <div class="dots-glow"></div>
    </div>

    <!-- Header (Unverändert, da perfekt) -->
        <header id="global-header"></header> 
<main class="gallery-page">
    <div class="gallery-container">
        <h1 class="gallery-headline">Galerie</h1>
        
        <div class="slider-viewport">
            <!-- Navigations-Pfeile -->
            <button class="slider-nav prev" onclick="changeSlide(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="slider-nav next" onclick="changeSlide(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <!-- Slides Container -->
            <div class="slides-track" id="slidesTrack">
                <!-- Slide 2: Benchy -->
                <div class="slide">
                    <img src="https://static.wixstatic.com/media/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg/v1/fit/w_1602,h_1568,q_90,enc_avif,quality_auto/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg" alt="Grünes Benchy">
                </div>
                <!-- Slide 3: Drucker Action -->
                <div class="slide">
                    <img src="https://static.wixstatic.com/media/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg/v1/fit/w_1602,h_1568,q_90,enc_avif,quality_auto/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg" alt="Grünes Benchy">
                </div>

                <div class="slide">
                    <img src="https://static.wixstatic.com/media/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg/v1/fit/w_1602,h_1568,q_90,enc_avif,quality_auto/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg" alt="Grünes Benchy">
                </div>

                <div class="slide">
                    <img src="https://static.wixstatic.com/media/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg/v1/fit/w_1602,h_1568,q_90,enc_avif,quality_auto/1a2196_41cb1db9a420437b892db50049df3942~mv2.jpg" alt="Grünes Benchy">
                </div>
            </div>
        </div>

        <!-- Bildunterschrift (Caption) -->
        <div class="caption-container">
            <p id="slideCaption">Ein wunderbares grünes Benchy-Boot.</p>
        </div>
    </div>
</main>
    <!-- Footer -->
    <footer>
        <div class="footer-inner">
            <span>© Copyright: Bahrian Novotny & Lorenzo Bay-Müller</span>
            <div class="footer-links">
                <a href="#">Impressum</a> | <a href="#">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Chat Button Fixed -->
    <div class="chat-fab">
        <i class="fa-regular fa-comment"></i> Chat with us
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
